[pytest]
testpaths = tests
addopts = -ra
markers =
    gui: opens a real (hidden) window; skipped when there is no display or customtkinter
    ffmpeg: needs ffmpeg and ffprobe; skipped when they are missing
    exe: tests the built dist/DISO.exe; skipped when it has not been built
    installer: runs the built dist/DISO-Setup-<version>.exe (in a temporary place); skipped when it has not been built
filterwarnings =
    ignore::DeprecationWarning
