# DISO for Linux and macOS: tests, builds the setup files, checks them from the outside and (for a published
# release) attaches them to it. The Windows setup is built on a PC (tools/build_installer.py).
name: Linux and macOS

on:
  workflow_dispatch:
  push:
    branches-ignore: [main]         # a branch being tried (main runs it for releases)
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-22.04 }
          - { name: macos-arm64, os: macos-14 }
          - { name: macos-x86_64, os: macos-15-intel }
    env:
      SDL_AUDIODRIVER: dummy          # the runners have no sound card
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb tk8.6 fonts-noto-color-emoji fonts-dejavu-core libnotify-bin x11-utils

      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt pyinstaller

      - name: Tests
        id: tests
        continue-on-error: true
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a -s "-screen 0 1440x900x24" python -m pytest -q -m "not exe and not installer" -p no:cacheprovider
          else
            python -m pytest -q -m "not exe and not installer" -p no:cacheprovider
          fi

      - name: Build
        run: python tools/build_unix.py

      - name: Check the built program
        run: |
          mkdir -p dist
          if [ "$RUNNER_OS" = Linux ]; then
            Xvfb :99 -screen 0 1440x900x24 & sleep 3
            DISPLAY=:99 python tools/unix/smoke.py build/unix/dist/DISO/DISO "dist/screenshot-${{ matrix.name }}.png"
          else
            python tools/unix/smoke.py build/unix/dist/DISO.app/Contents/MacOS/DISO "dist/screenshot-${{ matrix.name }}.png"
          fi

      - name: Install and remove (Linux)
        if: runner.os == 'Linux'
        run: |
          set -x
          sudo apt-get install -y ./dist/DISO-*.deb
          test -x /opt/diso/DISO && test -f /usr/share/applications/diso.desktop && test -L /usr/bin/diso
          test -f /etc/opt/chrome/native-messaging-hosts/com.iso.diso.json
          diso --selftest /tmp/deb.json && grep -q '"music_player": true' /tmp/deb.json
          sudo apt-get remove -y diso
          test ! -e /opt/diso && test ! -e /usr/bin/diso
          mkdir -p /tmp/tar && tar -xzf dist/DISO-*.tar.gz -C /tmp/tar
          /tmp/tar/DISO-*/install.sh --yes --no-start
          test -x ~/.local/opt/DISO/DISO && test -f ~/.local/share/applications/diso.desktop && test -L ~/.local/bin/diso
          ~/.local/opt/DISO/DISO --selftest /tmp/tar.json && grep -q '"music_player": true' /tmp/tar.json
          ~/.local/opt/DISO/uninstall.sh --yes --data
          test ! -e ~/.local/opt/DISO && test ! -e ~/.local/share/applications/diso.desktop && test ! -e ~/.local/share/DISO

      - name: Install and remove (macOS)
        if: runner.os == 'macOS'
        run: |
          set -x
          hdiutil attach dist/DISO-*.dmg -mountpoint /tmp/dmg -nobrowse
          ditto /tmp/dmg/DISO.app /Applications/DISO.app
          codesign --verify --deep --strict /Applications/DISO.app
          /Applications/DISO.app/Contents/MacOS/DISO --selftest /tmp/dmg.json && grep -q '"music_player": true' /tmp/dmg.json
          printf '2\ny\ny\n' | sh "/tmp/dmg/Uninstall DISO.command"
          test ! -e /Applications/DISO.app
          hdiutil detach /tmp/dmg

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DISO-${{ matrix.name }}
          path: dist/
          if-no-files-found: warn

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          gh release upload "${{ github.event.release.tag_name }}" dist/*.deb dist/*.tar.gz dist/*.dmg --clobber

      - name: The tests must pass
        if: steps.tests.outcome == 'failure'
        run: |
          echo "The tests failed (see the Tests step)"
          exit 1
