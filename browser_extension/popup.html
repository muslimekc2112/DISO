<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>DISO</title>
  <style>
    :root { color-scheme: light dark; --bg:#fff; --fg:#1d1f23; --muted:#6b7280; --card:#f1f3f6; --accent:#2f7de1; --line:#8883; }
    @media (prefers-color-scheme: dark) { :root { --bg:#25272b; --fg:#eceff4; --muted:#9aa3b2; --card:#2f3238; } }
    body { margin:0; width:320px; padding:14px; background:var(--bg); color:var(--fg); font:13px system-ui, sans-serif; }
    h1 { font-size:15px; margin:0 0 10px; display:flex; align-items:center; gap:8px; }
    h1 img { width:20px; height:20px; }
    .status { display:flex; align-items:center; gap:8px; padding:8px 10px; background:var(--card); border-radius:8px; margin-bottom:10px; }
    .dot { width:10px; height:10px; border-radius:50%; background:#b23b3b; flex:none; }
    .dot.on { background:#2e9e5b; }
    button { width:100%; padding:9px; margin:4px 0; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
    button.secondary { background:var(--card); color:var(--fg); }
    button.torrent { background:#6b3fa0; }
    button:disabled { opacity:.5; cursor:default; }
    label { display:flex; gap:8px; align-items:center; margin:10px 0 4px; }
    #msg { min-height:18px; margin-top:8px; color:var(--muted); }
    .downloads { color:var(--muted); margin:-4px 0 6px 2px; min-height:16px; }
    .list { margin:0 0 8px; }
    .row { padding:5px 0; border-bottom:1px solid var(--line); }
    .row:last-child { border-bottom:0; }
    .row .top { display:flex; justify-content:space-between; gap:8px; }
    .row .name { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .row .detail { color:var(--muted); flex:none; }
    .bar { height:4px; border-radius:2px; background:var(--card); margin-top:4px; overflow:hidden; }
    .bar span { display:block; height:100%; background:var(--accent); }
    .row.queued .bar span { background:var(--muted); }
    .more { color:var(--muted); font-size:12px; padding-top:4px; }
    .paste { display:flex; gap:6px; margin:6px 0 2px; }
    .paste input { flex:1; min-width:0; padding:7px 8px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--fg); font:inherit; }
    .paste button { width:auto; margin:0; padding:7px 10px; }
    .lang { position:absolute; top:12px; right:14px; display:flex; gap:2px; }
    .lang button { width:auto; margin:0; padding:2px 7px; font-size:11px; background:var(--card); color:var(--muted); border-radius:6px; }
    .lang button.on { background:var(--accent); color:#fff; }
    .found { background:var(--card); border-radius:8px; padding:8px 10px; margin:0 0 8px; }
    .found h2 { font-size:13px; margin:0 0 6px; display:flex; justify-content:space-between; align-items:center; }
    .found h2 a { font-size:11px; font-weight:normal; color:var(--accent); cursor:pointer; }
    .found .none { color:var(--muted); }
    .found .media { max-height:150px; overflow:auto; margin:0 0 6px; }
    .found label.media-row { display:flex; gap:6px; align-items:flex-start; margin:3px 0; }
    .found label.media-row span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--fg); }
    .found .opts { display:flex; gap:8px; align-items:center; margin:2px 0 4px; flex-wrap:wrap; }
    .found .opts label { margin:0; }
    .found select { padding:3px 4px; border-radius:6px; border:1px solid var(--line); background:var(--bg); color:var(--fg); font:inherit; }
    .found .subs { color:var(--muted); font-size:12px; }
    button.found-go { background:#7b3fa0; }
    .series { background:var(--card); border-radius:8px; padding:8px 10px; margin:0 0 8px; }
    .series h2 { font-size:13px; margin:0 0 6px; display:flex; justify-content:space-between; align-items:center; }
    .series h2 a { font-size:11px; font-weight:normal; color:var(--accent); cursor:pointer; }
    .series .eps { max-height:120px; overflow:auto; margin:0 0 6px; }
    .series label.ep-row { display:flex; gap:6px; align-items:center; margin:2px 0; }
    .series .progress { color:var(--muted); font-size:12px; margin:4px 0; }
    button.series-go { background:#1d7f6e; }
  </style>
</head>
<body>
  <h1><img src="icons/icon48.png" alt=""> DISO</h1>
  <div class="lang"><button id="lang-tr">TR</button><button id="lang-en">EN</button></div>
  <div class="status"><span id="dot" class="dot"></span><span id="state" data-i18n="checking">Kontrol ediliyor…</span></div>
  <div id="downloads" class="downloads"></div>
  <div id="list" class="list"></div>
  <div id="found" class="found" hidden>
    <h2><span id="foundTitle" data-i18n="foundTitle">🎞 Bu sayfada bulunan videolar</span><a id="allNone" data-i18n="allNone">Hepsi / hiçbiri</a></h2>
    <div id="foundNone" class="none" data-i18n="foundNone">Bu sayfada henüz video bulunmadı.</div>
    <div id="media" class="media"></div>
    <div class="opts">
      <span data-i18n="qualityLabel">Kalite</span>
      <select id="quality"><option value="En iyi" data-i18n="qualityBest">En iyi</option><option>2160p</option><option>1440p</option><option>1080p</option><option>720p</option><option>480p</option><option>360p</option></select>
      <label id="subsRow"><input type="checkbox" id="withSubs"> <span data-i18n="withSubs">Altyazıları da indir</span></label>
    </div>
    <div id="subsFound" class="subs"></div>
    <button id="foundVideo" class="found-go" data-i18n="sendFoundVideo">🎬 Seçilenleri MP4 indir</button>
    <button id="foundAudio" class="found-go" data-i18n="sendFoundAudio">🎵 Seçilenleri MP3 indir</button>
  </div>
  <div id="series" class="series" hidden>
    <h2><span id="seriesTitle"></span><a id="seriesAll" data-i18n="allNone">Hepsi / hiçbiri</a></h2>
    <div id="eps" class="eps"></div>
    <div id="seriesProgress" class="progress"></div>
    <button id="seriesGo" class="series-go" data-i18n="seriesGo">📺 Seçilen bölümleri sırayla indir</button>
    <button id="seriesStop" class="secondary" data-i18n="seriesStop" hidden>Durdur</button>
  </div>
  <button id="torrents" class="torrent" hidden></button>
  <button id="video" data-i18n="sendTabVideo">🎬 MP4 olarak indir (video)</button>
  <button id="audio" data-i18n="sendTabAudio">🎵 MP3 olarak indir (ses)</button>
  <div class="paste"><input id="paste" data-i18n-placeholder="pasteHint" placeholder="Link ya da magnet yapıştır…"><button id="pasteGo" data-i18n="pasteSend">⬇ İndir</button></div>
  <label><input type="checkbox" id="intercept"> <span data-i18n="catchDownloads">Tarayıcı indirmelerini yakala</span></label>
  <button id="open" class="secondary" data-i18n="openApp">▶ DISO'yu aç</button>
  <button id="options" class="secondary" data-i18n="settings">⚙ Ayarlar</button>
  <div id="msg"></div>
  <script src="lib.js"></script>
  <script src="popup.js"></script>
</body>
</html>
